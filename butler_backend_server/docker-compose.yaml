services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: butler_backend
      POSTGRES_PASSWORD: "cq1bi-TchvgfLCxwh--S16Th3norEZm_"
    volumes:
      - butler_backend_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "sxQug_Nug02Q4B2chMOTRzVVgNHrSsHM"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: butler_backend_test
      POSTGRES_PASSWORD: "a4xvTWLQpv0qUR13Q6XTDyiEP78HtF1k"
    volumes:
      - butler_backend_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "WrK7TXMettDt6zJMn4OxKoSUg0jM3MxH"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  butler_backend_data:
  butler_backend_test_data:
